<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEOX</title>
<script>
// === TAMBAHAN FIX 1: LOAD WARNA INSTAN BIAR GAK KEDIP PAS BARU MASUK ===
(function(){
  try{
    const t = localStorage.getItem('neox_theme');
    if(t){
      document.documentElement.style.setProperty('--acc', t);
    }
  }catch(e){}
})();
</script>
<style>
  /* FIX 1: PAKSA WARNA TERANG */
  :root{color-scheme:light;--bg:#f0f4f8;--fg:#111111;--acc:#ffe14d;--acc2:#ff5252;--acc3:#4dff88;--card:#ffffff;--line:#111111;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background-color:var(--bg);background-image:radial-gradient(#cbd5e1 2px,transparent 2px);background-size:20px 20px;color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding-bottom:120px;}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:16px;gap:8px}
  
  .logo-wrap{display:flex;align-items:center;gap:4px}
  .logo{font-size:22px;font-weight:900;border:3px solid var(--line);background:var(--card);padding:4px 10px;box-shadow:4px 4px 0 var(--line);display:flex;align-items:center}
  .logo span{background:var(--acc);padding:0 4px;border:2px solid var(--line);margin-left:2px}
  .header-verify{background:#1877F2;color:white;border-radius:50%;padding:2px 6px;font-weight:bold;font-size:12px;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line)}
  
  .search{flex:1;margin-left:8px}.search input{width:100%;background:var(--card);color:var(--fg);border:3px solid var(--line);padding:10px;font-family:inherit;font-weight:700;box-shadow:4px 4px 0 var(--line);outline:none}
  
  .card{background:var(--card);border:4px solid var(--line);box-shadow:8px 8px 0 var(--line);padding:20px;margin-bottom:24px}
  .card h2{font-size:14px;text-transform:uppercase;font-weight:900;color:var(--line);margin-bottom:16px;border-bottom:3px solid var(--line);padding-bottom:10px;letter-spacing:1px}
  
  .post-head{display:flex;justify-content:space-between;margin-bottom:12px;align-items:center}
  .author-wrap{display:flex;align-items:center;gap:8px}
  .author-avatar{width:36px;height:36px;background:var(--acc);border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;object-fit:cover}
  .post-author{font-size:14px;font-weight:900;background:var(--acc);padding:2px 8px;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line);display:flex;align-items:center;gap:4px}
  
  .post-verify{background:#1877F2;color:white;border-radius:50%;padding:1px 5px;font-weight:bold;font-size:10px;display:inline-flex;align-items:center;justify-content:center}
  .dev-text{background:#1877F2;color:white;font-size:8px;font-weight:900;padding:1px 4px;border-radius:3px;margin-left:2px;letter-spacing:0.5px}
  
  /* FIX 2: KOTAK CODE KUNING & TOMBOL CODE KUNING */
  .post-code{font-family:monospace;font-size:12px;background:var(--acc);border:2px solid var(--line);padding:4px 8px;color:var(--line);font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
  .post-title{font-size:18px;font-weight:900;margin-bottom:8px}
  .post-desc{font-size:14px;font-weight:600;margin-bottom:16px;color:#444;line-height:1.4}
  
  .post-media{margin:16px 0;border:4px solid var(--line);background:var(--card);display:flex;justify-content:center;box-shadow:4px 4px 0 var(--line)}
  .post-media img,.post-media video{max-width:100%;max-height:400px;object-fit:contain}
  .post-media audio{width:100%;padding:12px;background:var(--card)}
  .post-media pre{padding:16px;background:var(--acc);color:var(--line);font-family:monospace;font-size:13px;width:100%;overflow-x:auto;font-weight:700}
  
  .action-btn{background:var(--card);border:3px solid var(--line);padding:10px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:900;color:var(--line);box-shadow:3px 3px 0 var(--line);transition:transform .05s}
  .action-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
  .action-btn.danger{background:var(--acc2);color:#fff}
  .action-btn.share{background:var(--acc)}
  
  .comment-box{margin-top:16px;padding-top:16px;border-top:3px dashed var(--line)}
  .comment-item{font-size:13px;font-weight:600;margin-bottom:8px;padding:8px;background:var(--bg);border:2px solid var(--line)}
  .comment-item b{font-weight:900;color:var(--line)}
  .comment-input{display:flex;gap:8px;margin-top:12px}
  .comment-input input{flex:1;padding:10px;background:var(--card);border:3px solid var(--line);font-family:inherit;font-weight:600}
  .comment-input button{background:var(--acc);border:3px solid var(--line);font-weight:900;padding:0 16px;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
  
  .tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .tool-card{background:var(--card);border:3px solid var(--line);padding:16px;cursor:pointer;box-shadow:4px 4px 0 var(--line);text-align:center}
  .tool-card:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
  .tool-card .ico{font-size:32px;margin-bottom:8px}
  .tool-card .name{font-size:14px;font-weight:900}
  
  .tictactoe{display:grid;grid-template-columns:repeat(3, 1fr);gap:8px;max-width:300px;margin:0 auto 16px}
  .ttt-cell{background:var(--bg);border:3px solid var(--line);height:80px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
  .ttt-cell:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}

  .profile-head{display:flex;gap:16px;align-items:center;margin-bottom:20px}
  .avatar{width:80px;height:80px;background:var(--acc);border:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--line);object-fit:cover;box-shadow:4px 4px 0 var(--line)}
  .field{margin-bottom:16px}
  label{font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:8px;display:block}
  input[type=text],input[type=password],textarea,select{width:100%;background:var(--card);color:var(--fg);border:3px solid var(--line);padding:12px;font-family:inherit;font-weight:600;box-shadow:3px 3px 0 var(--line);outline:none}
  input[type=file]{width:100%;font-size:12px;font-weight:900;padding:10px;border:3px dashed var(--line);background:var(--bg);cursor:pointer}
  .btn{background:var(--acc);color:var(--line);border:4px solid var(--line);padding:14px;font-size:14px;font-weight:900;cursor:pointer;box-shadow:5px 5px 0 var(--line);width:100%;transition:transform .05s}
  .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--line)}
  
  .nav-container{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:100;pointer-events:none}
  .nav-pill{display:flex;gap:4px;background:var(--card);border:4px solid var(--line);padding:8px 12px;box-shadow:6px 6px 0 var(--line);pointer-events:auto;border-radius:50px}
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;height:50px;border-radius:30px;font-size:10px;font-weight:900;color:var(--line);cursor:pointer;transition:all .1s;text-decoration:none;text-transform:uppercase}
  .nav-item .ico{font-size:20px;margin-bottom:2px}
  .nav-item:active{transform:scale(0.9)}
  .nav-item.on{background:var(--acc);border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
  .nav-item.plus{background:var(--acc2);color:#fff;border:3px solid var(--line);box-shadow:2px 2px 0 var(--line);width:50px;height:50px;border-radius:50%}
  .nav-item.plus:active{box-shadow:0 0 0 var(--line);transform:translate(2px,2px)}
  
  .view{display:none}.view.on{display:block}
  
  /* FIX 3: NOTIFIKASI TOAST KUNING */
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--line);border:4px solid var(--line);padding:12px 24px;font-weight:900;font-size:14px;box-shadow:6px 6px 0 var(--line);z-index:999;display:none;text-transform:uppercase}
  .toast.on{display:block}

  /* === TAMBAHAN FIX 2: BIKIN SELECT JADI NEUBRUTALISM ASLI (ANTI HITAM) === */
  #setTheme{
    color-scheme: light !important;
    background: var(--card) !important;
    background-color: var(--card) !important;
    color: var(--line) !important;
    border:3px solid var(--line) !important;
    box-shadow:3px 3px 0 var(--line) !important;
    -webkit-appearance:none !important;
    -moz-appearance:none !important;
    appearance:none !important;
    font-weight:900 !important;
  }
  #setTheme option{
    background: #ffffff !important;
    color: #111111 !important;
    font-weight:900;
    padding:12px;
  }
  /* === TAMBAHAN FIX 3: CUSTOM PICKER NEUBRUTALISM (TANPA HAPUS SELECT ASLI) === */
  .theme-picker{position:relative;border:3px solid var(--line);background:var(--card);box-shadow:3px 3px 0 var(--line);margin-top:8px}
  .theme-current{display:flex;align-items:center;gap:10px;padding:12px;font-weight:900;cursor:pointer;background:var(--card)}
  .theme-dot{width:22px;height:22px;border:3px solid var(--line);display:inline-block;box-shadow:2px 2px 0 var(--line)}
  .theme-options{display:none;position:absolute;top:100%;left:-3px;right:-3px;background:var(--card);border:3px solid var(--line);border-top:none;box-shadow:4px 4px 0 var(--line);z-index:20}
  .theme-options.on{display:block}
  .theme-opt{padding:12px;display:flex;align-items:center;gap:10px;font-weight:900;cursor:pointer;border-top:3px solid var(--line);background:var(--card);color:var(--line)}
  .theme-opt span{width:22px;height:22px;border:3px solid var(--line);display:inline-block;box-shadow:2px 2px 0 var(--line)}
  .theme-opt:hover{background:var(--bg)}
  .theme-opt.on{background:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo-wrap">
      <div class="logo">NE<span>OX</span></div>
      <div class="header-verify">✓</div>
    </div>
    <div class="search"><input type="text" id="searchInput" placeholder="cari postingan..."></div>
  </div>
  
  <div class="view on" id="viewHome"><div id="feed"></div></div>
  
  <div class="view" id="viewTools">
    <div class="card"><h2>// tools & game</h2>
      <div class="tool-grid">
        <div class="tool-card" onclick="openTool('calc')"><div class="ico">🧮</div><div class="name">Kalkulator</div></div>
        <div class="tool-card" onclick="openTool('ttt')"><div class="ico">❌⭕</div><div class="name">Tic Tac Toe</div></div>
        <div class="tool-card" onclick="openTool('b64')"><div class="ico">🔐</div><div class="name">Base64</div></div>
        <div class="tool-card" onclick="openTool('qr')"><div class="ico">📱</div><div class="name">QR Code</div></div>
      </div>
      <div id="toolResult" style="display:none;border-top:3px dashed var(--line);padding-top:16px;margin-top:16px"></div>
    </div>
  </div>

  <div class="view" id="viewSettings">
    <div class="card">
      <h2>// pengaturan profil</h2>
      <div class="profile-head">
        <img id="setAvatar" class="avatar" src="" style="display:none;">
        <div id="setAvatarText" class="avatar">A</div>
        <div style="flex:1"><label>Ganti Foto Profil</label><input type="file" id="setPhoto" accept="image/*"></div>
      </div>
      <div class="field"><label>Nama Akun</label><input type="text" id="setName" maxlength="32"></div>
      <div class="field"><label>Password Akun</label><input type="text" id="setPass" placeholder="Password baru..."></div>
      <div class="field"><label>Bio</label><textarea id="setBio" maxlength="200" rows="3"></textarea></div>
      
      <div class="field">
        <label>Warna Tema Web</label>
        <select id="setTheme" onchange="changeTheme(this.value)">
          <option value="#ffe14d">Kuning (Default)</option>
          <option value="#ff5252">Merah</option>
          <option value="#4dff88">Hijau</option>
          <option value="#4d9fff">Biru</option>
        </select>
        <!-- TAMBAHAN: PICKER NEUBRUTALISM CUSTOM (TIDAK MENGHAPUS SELECT ASLI DI ATAS) -->
        <div class="theme-picker" id="themePicker">
          <div class="theme-current" onclick="toggleThemePicker()">
            <div class="theme-dot" id="currentDot" style="background:#ffe14d"></div>
            <span id="currentThemeText">Kuning (Default)</span>
            <span style="margin-left:auto;font-size:12px">▼</span>
          </div>
          <div class="theme-options" id="themeOptions">
            <div class="theme-opt on" data-value="#ffe14d" onclick="pickTheme('#ffe14d','Kuning (Default)',this)"><span style="background:#ffe14d"></span>Kuning (Default)</div>
            <div class="theme-opt" data-value="#ff5252" onclick="pickTheme('#ff5252','Merah',this)"><span style="background:#ff5252"></span>Merah</div>
            <div class="theme-opt" data-value="#4dff88" onclick="pickTheme('#4dff88','Hijau',this)"><span style="background:#4dff88"></span>Hijau</div>
            <div class="theme-opt" data-value="#4d9fff" onclick="pickTheme('#4d9fff','Biru',this)"><span style="background:#4d9fff"></span>Biru</div>
          </div>
        </div>
      </div>
      
      <button class="btn" onclick="saveProfile()">simpan perubahan</button>
    </div>
  </div>

  <div class="view" id="viewInfo">
    <div class="card"><h2>// info akun</h2>
      <div class="profile-head">
        <img id="infoAvatar" class="avatar" src="" style="display:none;">
        <div id="infoAvatarText" class="avatar">A</div>
        <div><div style="font-size:18px;font-weight:900" id="infoName">—</div><div style="font-size:12px;font-weight:700;opacity:.7" id="infoEmail">—</div></div>
      </div>
      <button class="btn" onclick="logout()" style="background:var(--acc2);color:#fff">logout</button>
    </div>
  </div>
</div>

<div class="nav-container">
  <div class="nav-pill">
    <a class="nav-item on" id="navHome" onclick="switchView('home')"><span class="ico">🏠</span>HOME</a>
    <a class="nav-item" id="navTools" onclick="switchView('tools')"><span class="ico">🔧</span>TOOLS</a>
    <a class="nav-item plus" href="upload.html">➕</a>
    <a class="nav-item" id="navSettings" onclick="switchView('settings')"><span class="ico">⚙️</span>SET</a>
    <a class="nav-item" id="navInfo" onclick="switchView('info')"><span class="ico">👤</span>INFO</a>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, updateDoc, deleteDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBK7pa3LJCxF1bP5_SbEA_3wQo5280n1FY", authDomain: "nanzz-account.firebaseapp.com", projectId: "nanzz-account", storageBucket: "nanzz-account.firebasestorage.app", messagingSenderId: "592556282125", appId: "1:592556282125:web:6f3b4ec30e1a362c106044" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const SUPER_DEV = "afnanpratama427@gmail.com";
let currentUser = null; let allPosts = []; let unsubFeed = null; let unsubUsers = []; let pendingPhotoBase64 = null;

window.toast = function(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}
window.logout = function(){ signOut(auth).then(()=>location.href='auth.html'); }
window.switchView = function(v) {
  ['Home','Tools','Settings','Info'].forEach(n => { 
    document.getElementById('view'+n).classList.remove('on'); 
    document.getElementById('nav'+n).classList.remove('on'); 
  });
  document.getElementById('view' + (v.charAt(0).toUpperCase() + v.slice(1))).classList.add('on');
  document.getElementById('nav' + (v.charAt(0).toUpperCase() + v.slice(1))).classList.add('on');
  if(v === 'settings' || v === 'info') renderProfile();
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'auth.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().banned) { location.href = 'auth.html'; return; }
  
  currentUser = { uid: user.uid, ...snap.data() };
  if(currentUser.theme) {
    document.documentElement.style.setProperty('--acc', currentUser.theme);
    try{localStorage.setItem('neox_theme', currentUser.theme);}catch(e){}
  }
  
  onSnapshot(doc(db, 'users', user.uid), (docSnap) => {
    if(docSnap.exists()) { 
      currentUser = { uid: user.uid, ...docSnap.data() }; 
      if(currentUser.theme){
        document.documentElement.style.setProperty('--acc', currentUser.theme);
        try{localStorage.setItem('neox_theme', currentUser.theme);}catch(e){}
      }
      renderProfile(); 
    }
  });

  unsubUsers.push(onSnapshot(collection(db, 'users'), (userSnap) => {
    window.allUsers = {};
    userSnap.forEach(u => { window.allUsers[u.id] = u.data(); });
    renderFeed();
  }));

  loadFeed();
});

function loadFeed() {
  if (unsubFeed) unsubFeed();
  const q1 = query(collection(db, 'posts'), orderBy('createdAt', 'desc'));
  unsubFeed = onSnapshot(q1, snap => { allPosts = []; snap.forEach(d => allPosts.push({code: d.id, ...d.data()})); renderFeed(); });
}

function renderFeed() {
  let posts = allPosts;
  const f = document.getElementById('searchInput').value.toLowerCase();
  if (f) posts = posts.filter(p => (p.title||'').toLowerCase().includes(f) || (p.author||'').toLowerCase().includes(f));
  
  document.getElementById('feed').innerHTML = posts.map(p => {
    const authorData = window.allUsers[p.authorId] || {};
    const isDev = authorData.role === 'developer' || authorData.email === SUPER_DEV || p.author === 'Developer';
    const isVerified = authorData.isVerified || p.isVerified || isDev; 
    const authorPhoto = authorData.photo || p.authorPhoto; 

    const verifyHtml = isDev 
      ? `<span class="post-verify">✓</span><span class="dev-text">DEVELOPER</span>` 
      : (isVerified ? `<span class="post-verify">✓</span>` : '');

    const avatarHtml = authorPhoto 
      ? `<img src="${authorPhoto}" class="author-avatar">` 
      : `<div class="author-avatar">${p.author.charAt(0).toUpperCase()}</div>`;

    return `
    <div class="card">
      <div class="post-head">
        <div class="author-wrap">
          ${avatarHtml}
          <div class="post-author">@${p.author} ${verifyHtml}</div>
        </div>
        <div class="post-code" onclick="copyCode('${p.code}')">${p.code}</div>
      </div>
      <div class="post-title">${p.title}</div>
      <div class="post-desc">${p.desc||''}</div>
      ${p.type==='image'&&p.fileUrl?`<div class="post-media"><img src="${p.fileUrl}"></div>`:''}
      ${p.type==='video'&&p.fileUrl?`<div class="post-media"><video src="${p.fileUrl}" controls></video></div>`:''}
      ${p.type==='audio'&&p.fileUrl?`<div class="post-media"><audio src="${p.fileUrl}" controls></audio></div>`:''}
      ${p.type==='code'&&p.content?`<div class="post-media"><pre>${p.content.replace(/</g,'&lt;')}</pre></div>`:''}
      ${p.type==='html'&&p.fileUrl?`<div class="post-media"><iframe src="${p.fileUrl}" style="width:100%;height:300px;border:0;background:#fff"></iframe></div>`:''}
      ${p.type==='apk'||p.type==='file'?`<div class="post-media" style="display:block;padding:16px"><b style="font-size:16px">${p.filename}</b><br><br><a href="${p.fileUrl}" download="${p.filename}" class="action-btn" style="display:inline-block;text-decoration:none">⬇ DOWNLOAD FILE</a></div>`:''}
      ${p.type==='link'?`<div class="post-media" style="display:block;padding:16px"><a href="${p.url}" target="_blank" style="color:var(--line);font-weight:900">${p.url}</a></div>`:''}
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="action-btn share" onclick="sharePost('${p.code}')">🔗 SHARE</button>
        ${currentUser.name === p.author ? `<button class="action-btn danger" onclick="delPost('${p.code}')">🗑 HAPUS</button>`:''}
      </div>
      <div class="comment-box">
        <div id="comments-${p.code}" style="max-height:150px;overflow-y:auto;">Memuat...</div>
        <div class="comment-input"><input type="text" id="input-${p.code}" placeholder="Tulis komentar..."><button onclick="sendComment('${p.code}')">KIRIM</button></div>
      </div>
    </div>`; 
  }).join('');
  posts.forEach(p => loadComments(p.code));
}

window.copyCode = function(code) {
  navigator.clipboard.writeText(code).then(() => toast('CODE DICOPY!'));
}

function loadComments(code) {
  onSnapshot(query(collection(db, 'posts', code, 'comments'), orderBy('time', 'asc')), snap => {
    const box = document.getElementById('comments-' + code);
    if (!box) return;
    box.innerHTML = snap.empty ? '<span style="font-size:12px;font-weight:700">Belum ada komentar.</span>' : '';
    snap.forEach(d => { const c = d.data(); box.innerHTML += `<div class="comment-item"><b>@${c.author}</b>: ${c.text}</div>`; });
    box.scrollTop = box.scrollHeight;
  });
}

window.sendComment = async function(code) {
  const inp = document.getElementById('input-' + code); if (!inp.value.trim()) return;
  await addDoc(collection(db, 'posts', code, 'comments'), { author: currentUser.name, text: inp.value.trim(), time: serverTimestamp() }); inp.value = '';
}

window.sharePost = function(code) {
  const url = location.origin + location.pathname + '?code=' + code;
  navigator.clipboard.writeText(url).then(()=>toast('LINK DICOPY!'));
}
window.delPost = async function(code) { if(!confirm('Hapus postingan?')) return; await deleteDoc(doc(db, 'posts', code)); toast('DIHAPUS'); }

document.getElementById('setPhoto').addEventListener('change', function(e) {
  const file = e.target.files[0]; if(!file) return;
  if(file.size > 500 * 1024) return toast('Max 500KB');
  const reader = new FileReader();
  reader.onload = (ev) => {
    pendingPhotoBase64 = ev.target.result;
    document.getElementById('setAvatar').src = pendingPhotoBase64;
    document.getElementById('setAvatar').style.display = 'block';
    document.getElementById('setAvatarText').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

function renderProfile() {
  if (!currentUser) return;
  document.getElementById('infoName').textContent = '@' + currentUser.name;
  document.getElementById('infoEmail').textContent = currentUser.email;
  document.getElementById('setName').value = currentUser.name;
  document.getElementById('setBio').value = currentUser.bio || '';
  document.getElementById('setPass').value = currentUser.pass || ''; 
  document.getElementById('setTheme').value = currentUser.theme || '#ffe14d';
  
  // === TAMBAHAN: SYNC CUSTOM PICKER DENGAN SELECT ASLI ===
  try{
    const themeMap = {'#ffe14d':'Kuning (Default)','#ff5252':'Merah','#4dff88':'Hijau','#4d9fff':'Biru'};
    const cur = currentUser.theme || '#ffe14d';
    const dot = document.getElementById('currentDot');
    const txt = document.getElementById('currentThemeText');
    if(dot) dot.style.background = cur;
    if(txt) txt.textContent = themeMap[cur] || cur;
    document.querySelectorAll('.theme-opt').forEach(o=>{
      o.classList.toggle('on', o.getAttribute('data-value')===cur);
    });
  }catch(e){}

  if(currentUser.photo) {
    document.getElementById('infoAvatar').src = currentUser.photo;
    document.getElementById('infoAvatar').style.display = 'block';
    document.getElementById('infoAvatarText').style.display = 'none';
    document.getElementById('setAvatar').src = currentUser.photo;
    document.getElementById('setAvatar').style.display = 'block';
    document.getElementById('setAvatarText').style.display = 'none';
  }
}

window.changeTheme = function(color) {
  document.documentElement.style.setProperty('--acc', color);
  try{localStorage.setItem('neox_theme', color);}catch(e){}
  // sync select asli
  const sel = document.getElementById('setTheme');
  if(sel) sel.value = color;
}

// === TAMBAHAN: FUNGSI PICKER NEUBRUTALISM ===
window.toggleThemePicker = function(){
  const opt = document.getElementById('themeOptions');
  if(opt) opt.classList.toggle('on');
}
window.pickTheme = function(color, label, el){
  document.getElementById('setTheme').value = color;
  const dot = document.getElementById('currentDot');
  const txt = document.getElementById('currentThemeText');
  if(dot) dot.style.background = color;
  if(txt) txt.textContent = label;
  document.querySelectorAll('.theme-opt').forEach(o=>o.classList.remove('on'));
  if(el) el.classList.add('on');
  const optBox = document.getElementById('themeOptions');
  if(optBox) optBox.classList.remove('on');
  changeTheme(color);
}

window.saveProfile = async function() {
  const newName = document.getElementById('setName').value.trim();
  const newBio = document.getElementById('setBio').value.trim();
  const newPass = document.getElementById('setPass').value.trim();
  const newTheme = document.getElementById('setTheme').value;
  
  if(newName.length < 8) return toast('Nama minimal 8 karakter');
  if(newPass.length < 4) return toast('Pass minimal 4 karakter');
  
  let updateData = { name: newName, bio: newBio, pass: newPass, theme: newTheme };
  if(pendingPhotoBase64) updateData.photo = pendingPhotoBase64;

  try {
    await updateDoc(doc(db, 'users', currentUser.uid), updateData);
    try{localStorage.setItem('neox_theme', newTheme);}catch(e){}
    toast('PROFIL DISIMPAN!');
    pendingPhotoBase64 = null;
  } catch(e) { toast(e.message); }
}

window.openTool = function(t) {
  const res = document.getElementById('toolResult'); res.style.display = 'block';
  if(t === 'calc') {
    res.innerHTML = `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <input type="text" id="calcIn" placeholder="1+1" style="grid-column:span 3;font-size:20px;text-align:right">
      <button class="btn" onclick="document.getElementById('calcOut').textContent=eval(document.getElementById('calcIn').value)" style="grid-column:span 3">Hitung</button>
      <div id="calcOut" style="grid-column:span 3;text-align:center;font-size:24px;font-weight:900"></div>
    </div>`;
  } else if(t === 'ttt') {
    res.innerHTML = `<div class="tictactoe" id="tttBoard"></div><div id="tttStatus" style="text-align:center;font-weight:900;margin-bottom:12px">Giliran: X</div><button class="btn" onclick="resetTTT()">Reset</button>`;
    resetTTT();
  } else if(t === 'b64') {
    res.innerHTML = `<textarea id="b64In" placeholder="ketik teks..."></textarea>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="document.getElementById('b64Out').value=btoa(document.getElementById('b64In').value)">Encode</button><button class="btn" onclick="document.getElementById('b64Out').value=atob(document.getElementById('b64In').value)">Decode</button></div>
      <input type="text" id="b64Out" readonly placeholder="hasil...">`;
  } else if(t === 'qr') {
    res.innerHTML = `<input type="text" id="qrIn" placeholder="teks / url...">
      <button class="btn" style="margin-top:8px" onclick="document.getElementById('qrImg').src='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(document.getElementById('qrIn').value)">Buat QR</button>
      <div style="text-align:center;margin-top:16px"><img id="qrImg" style="border:3px solid #000;max-width:100%"></div>`;
  }
}

let tttState = ["", "", "", "", "", "", "", "", ""];
let tttTurn = "X"; let tttActive = true;
window.resetTTT = function() {
  tttState = ["", "", "", "", "", "", "", "", ""]; tttTurn = "X"; tttActive = true;
  document.getElementById('tttStatus').textContent = "Giliran: X";
  updateTTTBoard();
}
window.playTTT = function(i) {
  if (!tttActive || tttState[i] !== "") return;
  tttState[i] = tttTurn; updateTTTBoard();
  if (checkTTTWin(tttTurn)) { document.getElementById('tttStatus').textContent = `PEMAIN ${tttTurn} MENANG! 🎉`; tttActive = false; return; }
  if (!tttState.includes("")) { document.getElementById('tttStatus').textContent = `SERI! 🤝`; tttActive = false; return; }
  
  tttTurn = "O"; document.getElementById('tttStatus').textContent = "Bot mikir...";
  setTimeout(botTTTMove, 500);
}
function botTTTMove() {
  if (!tttActive) return;
  let empty = tttState.map((v, i) => v === "" ? i : null).filter(v => v !== null);
  if (empty.length === 0) return;
  let move = empty[Math.floor(Math.random() * empty.length)];
  tttState[move] = "O"; updateTTTBoard();
  if (checkTTTWin("O")) { document.getElementById('tttStatus').textContent = `BOT MENANG! 🤖`; tttActive = false; return; }
  if (!tttState.includes("")) { document.getElementById('tttStatus').textContent = `SERI! 🤝`; tttActive = false; return; }
  tttTurn = "X"; document.getElementById('tttStatus').textContent = "Giliran: X";
}
function updateTTTBoard() {
  document.getElementById('tttBoard').innerHTML = tttState.map((v, i) => `<div class="ttt-cell" onclick="playTTT(${i})">${v}</div>`).join('');
}
function checkTTTWin(p) {
  const win = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return win.some(w => tttState[w[0]] === p && tttState[w[1]] === p && tttState[w[2]] === p);
}
