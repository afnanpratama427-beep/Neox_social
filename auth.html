<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk · Neox</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0d0d0f;--fg:#e6e6e6;--acc:#ffe14d;--acc2:#ff5252;--card:#141418;--line:#2a2a30}
  body{background:var(--bg);color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:3px solid #000;box-shadow:8px 8px 0 0 #000;padding:32px;width:100%;max-width:400px}
  h1{font-size:28px;font-weight:900;letter-spacing:-.04em;margin-bottom:6px}
  h1 span{background:var(--acc);color:#000;padding:0 6px}
  .sub{opacity:.6;font-size:13px;margin-bottom:24px}
  .tabs{display:flex;border:2px solid #000;margin-bottom:20px}
  .tab{flex:1;background:var(--card);color:var(--fg);border:none;padding:12px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--acc);color:#000}
  .field{margin-bottom:14px}
  label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;opacity:.75;font-weight:700}
  input{width:100%;background:var(--bg);color:var(--fg);border:2px solid var(--line);padding:12px;font-family:inherit;font-size:14px;outline:none}
  input:focus{border-color:var(--acc)}
  .hint{font-size:11px;opacity:.5;margin-top:4px}
  .hint.err{color:var(--acc2);opacity:1}
  .btn{background:var(--acc);color:#000;border:3px solid #000;padding:14px;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;box-shadow:5px 5px 0 0 #000;transition:transform .08s,box-shadow .08s;font-family:inherit;width:100%}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 0 #000}
  .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 0 #000}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:12px;padding:10px;margin-bottom:14px;border:2px solid;display:none}
  .msg.err{display:block;color:var(--acc2);border-color:var(--acc2);background:#2a1010}
  .msg.ok{display:block;color:#4dff88;border-color:#4dff88;background:#0f2a18}
</style>
</head>
<body>
<div class="card">
  <h1>ne<span>ox</span></h1>
  <p class="sub">platform share · realtime</p>

  <div class="tabs">
    <button class="tab on" id="tabLogin" onclick="switchTab('login')">login</button>
    <button class="tab" id="tabReg" onclick="switchTab('reg')">register</button>
  </div>

  <div class="msg" id="msg"></div>

  <div id="loginForm">
    <div class="field">
      <label>email</label>
      <input type="email" id="liEmail" placeholder="kamu@email.com" autocomplete="username">
    </div>
    <div class="field">
      <label>sandi</label>
      <input type="password" id="liPass" placeholder="password" autocomplete="current-password">
    </div>
    <button class="btn" id="liBtn" onclick="doLogin()">masuk →</button>
  </div>

  <div id="regForm" style="display:none">
    <div class="field">
      <label>email</label>
      <input type="email" id="rgEmail" placeholder="kamu@email.com">
    </div>
    <div class="field">
      <label>nama akun (8-32 karakter)</label>
      <input type="text" id="rgName" placeholder="minimal 8 karakter" maxlength="32">
      <div class="hint" id="nameHint">8-32 karakter, huruf/angka/underscore</div>
    </div>
    <div class="field">
      <label>sandi (4-24 karakter)</label>
      <input type="password" id="rgPass" placeholder="minimal 4 karakter" maxlength="24">
      <div class="hint" id="passHint">4-24 karakter</div>
    </div>
    <button class="btn" id="rgBtn" onclick="doRegister()">daftar →</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBK7pa3LJCxF1bP5_SbEA_3wQo5280n1FY",
  authDomain: "nanzz-account.firebaseapp.com",
  projectId: "nanzz-account",
  storageBucket: "nanzz-account.firebasestorage.app",
  messagingSenderId: "592556282125",
  appId: "1:592556282125:web:6f3b4ec30e1a362c106044",
  measurementId: "G-P62RNTWGMY"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.__auth = auth;
window.__db = db;
window.__fns = { doc, setDoc, getDoc, serverTimestamp,
  createUserWithEmailAndPassword, signInWithEmailAndPassword };

onAuthStateChanged(auth, async (user) => {
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists() && !snap.data().banned) {
      location.href = 'public.html';
    }
  }
});

window.fbReady = true;
window.dispatchEvent(new Event('fbready'));
</script>

<script>
function showMsg(t, type) {
  const m = document.getElementById('msg');
  m.textContent = t;
  m.className = 'msg ' + type;
  setTimeout(() => m.className = 'msg', 5000);
}

function switchTab(t) {
  document.getElementById('tabLogin').classList.toggle('on', t === 'login');
  document.getElementById('tabReg').classList.toggle('on', t === 'reg');
  document.getElementById('loginForm').style.display = t === 'login' ? 'block' : 'none';
  document.getElementById('regForm').style.display = t === 'reg' ? 'block' : 'none';
}

document.getElementById('rgName')?.addEventListener('input', e => {
  const v = e.target.value, h = document.getElementById('nameHint');
  const ok = v.length >= 8 && v.length <= 32 && /^[a-zA-Z0-9_]+$/.test(v);
  h.textContent = ok ? '✓ valid' : `${v.length}/8 min · huruf/angka/underscore`;
  h.className = 'hint' + (v && !ok ? ' err' : '');
});
document.getElementById('rgPass')?.addEventListener('input', e => {
  const v = e.target.value, h = document.getElementById('passHint');
  const ok = v.length >= 4 && v.length <= 24;
  h.textContent = ok ? '✓ valid' : `${v.length}/4 min`;
  h.className = 'hint' + (v && !ok ? ' err' : '');
});

async function doRegister() {
  if (!window.fbReady) return showMsg('firebase loading...', 'err');
  const email = document.getElementById('rgEmail').value.trim();
  const name  = document.getElementById('rgName').value.trim();
  const pass  = document.getElementById('rgPass').value;

  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showMsg('email tidak valid', 'err');
  if (name.length < 8 || name.length > 32) return showMsg('nama akun harus 8-32 karakter', 'err');
  if (!/^[a-zA-Z0-9_]+$/.test(name)) return showMsg('nama akun hanya huruf, angka, underscore', 'err');
  if (pass.length < 4 || pass.length > 24) return showMsg('sandi harus 4-24 karakter', 'err');

  const btn = document.getElementById('rgBtn');
  btn.disabled = true; btn.textContent = 'mendaftar...';

  try {
    const { createUserWithEmailAndPassword, doc, setDoc, getDoc, serverTimestamp } = window.__fns;
    const nameCheck = await getDoc(doc(window.__db, 'usernames', name.toLowerCase()));
    if (nameCheck.exists()) {
      btn.disabled = false; btn.textContent = 'daftar →';
      return showMsg('nama akun sudah dipakai', 'err');
    }

    const cred = await createUserWithEmailAndPassword(window.__auth, email, pass);
    await setDoc(doc(window.__db, 'users', cred.user.uid), {
      uid: cred.user.uid,
      email: email,
      name: name,
      banned: false,
      bio: '',
      theme: 'dark',
      createdAt: serverTimestamp()
    });
    await setDoc(doc(window.__db, 'usernames', name.toLowerCase()), {
      uid: cred.user.uid, name: name
    });
    await setDoc(doc(window.__db, 'activity', Date.now() + '_' + Math.random()), {
      uid: cred.user.uid, user: name, action: 'register',
      detail: email, time: serverTimestamp()
    });

    showMsg('akun dibuat — login...', 'ok');
    setTimeout(() => location.href = 'public.html', 1000);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'daftar →';
    showMsg(e.message.replace('Firebase: ', ''), 'err');
  }
}

async function doLogin() {
  if (!window.fbReady) return showMsg('firebase loading...', 'err');
  const email = document.getElementById('liEmail').value.trim();
  const pass  = document.getElementById('liPass').value;
  if (!email || !pass) return showMsg('isi email dan sandi', 'err');

  const btn = document.getElementById('liBtn');
  btn.disabled = true; btn.textContent = 'masuk...';

  try {
    const { signInWithEmailAndPassword, doc, getDoc, setDoc, serverTimestamp } = window.__fns;
    const cred = await signInWithEmailAndPassword(window.__auth, email, pass);
    const snap = await getDoc(doc(window.__db, 'users', cred.user.uid));

    if (!snap.exists()) {
      btn.disabled = false; btn.textContent = 'masuk →';
      return showMsg('akun tidak ditemukan', 'err');
    }
    if (snap.data().banned) {
      btn.disabled = false; btn.textContent = 'masuk →';
      return showMsg('akun ini dibanned', 'err');
    }

    await setDoc(doc(window.__db, 'activity', Date.now() + '_' + Math.random()), {
      uid: cred.user.uid, user: snap.data().name, action: 'login',
      detail: '', time: serverTimestamp()
    });

    showMsg('masuk...', 'ok');
    setTimeout(() => location.href = 'public.html', 600);
  } catch(e) {
    btn.disabled = false; btn.textContent = 'masuk →';
    const msg = e.message.includes('invalid-credential') || e.message.includes('wrong-password')
      ? 'email atau sandi salah'
      : e.message.replace('Firebase: ', '');
    showMsg(msg, 'err');
  }
}
</script>
</body>
</html>
