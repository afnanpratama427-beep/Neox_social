<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masuk · Neox</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f0f4f8;--fg:#111111;--acc:#ffe14d;--acc2:#ff5252;--card:#ffffff;--line:#111111;}
  body{background-color:var(--bg);background-image:radial-gradient(#cbd5e1 2px,transparent 2px);background-size:20px 20px;color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:4px solid var(--line);box-shadow:8px 8px 0 var(--line);padding:32px;width:100%;max-width:400px;animation:popIn .3s ease-out}
  @keyframes popIn{0%{transform:scale(0.9);opacity:0}100%{transform:scale(1);opacity:1}}
  h1{font-size:32px;font-weight:900;letter-spacing:-.04em;margin-bottom:6px}
  h1 span{background:var(--acc);color:var(--line);padding:0 8px;border:3px solid var(--line);box-shadow:3px 3px 0 var(--line);display:inline-block}
  .sub{opacity:.8;font-size:14px;font-weight:700;margin-bottom:24px}
  .tabs{display:flex;border:3px solid var(--line);margin-bottom:24px;background:var(--card);box-shadow:4px 4px 0 var(--line)}
  .tab{flex:1;background:var(--card);color:var(--line);border:none;padding:14px;font-size:13px;font-weight:900;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:all .1s}
  .tab.on{background:var(--acc);border-right:3px solid var(--line)}
  .tab:last-child{border-right:none;border-left:3px solid var(--line)}
  .field{margin-bottom:16px}
  label{display:block;font-size:12px;text-transform:uppercase;margin-bottom:8px;font-weight:900}
  input{width:100%;background:var(--card);color:var(--line);border:3px solid var(--line);padding:12px;font-family:inherit;font-size:14px;font-weight:600;box-shadow:3px 3px 0 var(--line);outline:none;transition:all .1s}
  input:focus{border-color:var(--acc);box-shadow:3px 3px 0 var(--acc);transform:translate(-2px,-2px)}
  .btn{background:var(--acc);color:var(--line);border:4px solid var(--line);padding:16px;font-size:15px;font-weight:900;text-transform:uppercase;cursor:pointer;box-shadow:5px 5px 0 var(--line);font-family:inherit;width:100%;transition:transform .05s}
  .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--line)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{font-size:13px;font-weight:700;padding:12px;margin-bottom:16px;border:3px solid;display:none;box-shadow:3px 3px 0 var(--line);text-transform:uppercase}
  .msg.err{display:block;color:var(--line);background:var(--acc2);border-color:var(--line);box-shadow:3px 3px 0 var(--line)}
  .msg.ok{display:block;color:var(--line);background:var(--acc);border-color:var(--line);box-shadow:3px 3px 0 var(--line)}
</style>
</head>
<body>
<div class="card">
  <h1>ne<span>ox</span></h1>
  <p class="sub">platform share · realtime</p>
  <div class="tabs">
    <button class="tab on" id="tabLogin" onclick="switchTab('login')">LOGIN</button>
    <button class="tab" id="tabReg" onclick="switchTab('reg')">REGISTER</button>
  </div>
  <div class="msg" id="msg"></div>
  <div id="loginForm">
    <div class="field"><label>email</label><input type="email" id="liEmail" placeholder="kamu@email.com"></div>
    <div class="field"><label>sandi</label><input type="password" id="liPass" placeholder="sandi rahasia"></div>
    <button class="btn" id="liBtn" onclick="doLogin()">masuk →</button>
  </div>
  <div id="regForm" style="display:none">
    <div class="field"><label>email</label><input type="email" id="rgEmail" placeholder="kamu@email.com"></div>
    <div class="field"><label>nama akun (8-32)</label><input type="text" id="rgName" maxlength="32" placeholder="minimal 8 huruf"></div>
    <div class="field"><label>sandi (4-24)</label><input type="password" id="rgPass" maxlength="24" placeholder="minimal 4 huruf"></div>
    <button class="btn" id="rgBtn" onclick="doRegister()">daftar →</button>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBK7pa3LJCxF1bP5_SbEA_3wQo5280n1FY", authDomain: "nanzz-account.firebaseapp.com", projectId: "nanzz-account", storageBucket: "nanzz-account.firebasestorage.app", messagingSenderId: "592556282125", appId: "1:592556282125:web:6f3b4ec30e1a362c106044" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const SUPER_DEV = "afnanpratama427@gmail.com";
window.__auth = auth; window.__db = db; window.__fns = { doc, setDoc, getDoc, serverTimestamp, createUserWithEmailAndPassword, signInWithEmailAndPassword };
onAuthStateChanged(auth, async (user) => {
  if (user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists()) {
      const data = snap.data();
      if (data.role === 'developer' || user.email === SUPER_DEV) location.href = 'admin.html';
      else if (!data.banned) location.href = 'public.html';
    }
  }
});
window.fbReady = true;
</script>
<script>
function showMsg(t, type) { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + type; setTimeout(() => m.className = 'msg', 4000); }
function switchTab(t) {
  document.getElementById('tabLogin').classList.toggle('on', t === 'login');
  document.getElementById('tabReg').classList.toggle('on', t === 'reg');
  document.getElementById('loginForm').style.display = t === 'login' ? 'block' : 'none';
  document.getElementById('regForm').style.display = t === 'reg' ? 'block' : 'none';
}
async function doRegister() {
  const email = document.getElementById('rgEmail').value.trim();
  const name  = document.getElementById('rgName').value.trim();
  const pass  = document.getElementById('rgPass').value;
  if (name.length < 8 || name.length > 32) return showMsg('Nama 8-32 karakter', 'err');
  if (pass.length < 4 || pass.length > 24) return showMsg('Sandi 4-24 karakter', 'err');
  const btn = document.getElementById('rgBtn'); btn.disabled = true; btn.textContent = 'Loading...';
  try {
    const { createUserWithEmailAndPassword, doc, setDoc, getDoc, serverTimestamp } = window.__fns;
    const nc = await getDoc(doc(window.__db, 'usernames', name.toLowerCase()));
    if (nc.exists()) throw new Error('Nama sudah dipakai');
    const cred = await createUserWithEmailAndPassword(window.__auth, email, pass);
    await setDoc(doc(window.__db, 'users', cred.user.uid), { uid: cred.user.uid, email, name, banned: false, role: 'user', createdAt: serverTimestamp() });
    await setDoc(doc(window.__db, 'usernames', name.toLowerCase()), { uid: cred.user.uid, name });
    showMsg('Berhasil, login...', 'ok'); setTimeout(() => switchTab('login'), 1500);
  } catch(e) { showMsg(e.message.replace('Firebase: ',''), 'err'); } finally { btn.disabled = false; btn.textContent = 'daftar →'; }
}
async function doLogin() {
  const email = document.getElementById('liEmail').value.trim();
  const pass  = document.getElementById('liPass').value;
  const btn = document.getElementById('liBtn'); btn.disabled = true; btn.textContent = 'Loading...';
  try {
    const { signInWithEmailAndPassword, doc, getDoc, setDoc, serverTimestamp } = window.__fns;
    const cred = await signInWithEmailAndPassword(window.__auth, email, pass);
    const snap = await getDoc(doc(window.__db, 'users', cred.user.uid));
    if (!snap.exists()) throw new Error('Akun tidak ditemukan');
    const data = snap.data(); if (data.banned) throw new Error('Akun dibanned');
    if (data.role === 'developer' || email === "afnanpratama427@gmail.com") { location.href = 'admin.html'; return; }
    await setDoc(doc(window.__db, 'activity', Date.now()+'_'+Math.random()), { uid: cred.user.uid, user: data.name, action: 'login', time: serverTimestamp() });
    location.href = 'public.html';
  } catch(e) { showMsg('Email/Sandi salah atau dibanned', 'err'); } finally { btn.disabled = false; btn.textContent = 'masuk →'; }
}
</script>
</body>
</html>
