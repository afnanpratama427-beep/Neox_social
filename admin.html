<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Developer - Neox</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f0f4f8;--fg:#111111;--acc:#ffe14d;--acc2:#ff5252;--acc3:#4dff88;--card:#ffffff;--line:#111111}
  body{background-color:var(--bg);background-image:radial-gradient(#cbd5e1 2px,transparent 2px);background-size:20px 20px;color:var(--fg);font-family:'Inter',system-ui,sans-serif;padding:24px;min-height:100vh}
  .wrap{max-width:800px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .logo{font-size:24px;font-weight:900;border:3px solid var(--line);background:var(--card);padding:4px 10px;box-shadow:4px 4px 0 var(--line)}
  .logo span{background:var(--acc2);color:#fff;padding:0 6px;border:2px solid var(--line)}
  .card{background:var(--card);border:4px solid var(--line);box-shadow:8px 8px 0 var(--line);padding:20px;margin-bottom:20px}
  .card h2{font-size:16px;font-weight:900;text-transform:uppercase;margin-bottom:20px;border-bottom:3px solid var(--line);padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:1px}
  .user-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:16px;margin-bottom:12px;border:3px solid var(--line);box-shadow:4px 4px 0 var(--line);flex-wrap:wrap;gap:12px}
  .user-name{font-weight:900;font-size:16px;margin-bottom:4px}
  .user-email{font-size:12px;font-weight:700;opacity:.8}
  .badge{font-size:10px;padding:4px 8px;font-weight:900;margin-left:8px;border:2px solid var(--line)}
  .badge.ban{background:var(--acc2);color:#fff}.badge.ok{background:var(--acc3);color:var(--line)}.badge.dev{background:#4d9fff;color:#fff}
  .btn{background:var(--card);border:3px solid var(--line);padding:8px 12px;font-weight:900;font-size:11px;cursor:pointer;font-family:inherit;margin-left:4px;box-shadow:3px 3px 0 var(--line);text-transform:uppercase;transition:transform .05s}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
  .btn.ban{background:var(--acc2);color:#fff}.btn.unban{background:var(--acc3);color:var(--line)}.btn.del{background:var(--line);color:#fff}
  .btn.refresh{background:var(--acc);color:var(--line)}.btn.dev{background:#4d9fff;color:#fff}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--line);border:4px solid var(--line);padding:12px 24px;font-weight:900;box-shadow:6px 6px 0 var(--line);z-index:999;display:none;text-transform:uppercase}
  .toast.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">ne<span>ox</span> dev</div>
    <button class="btn del" onclick="logout()">LOGOUT</button>
  </div>
  <div class="card">
    <h2>// Manajemen Akun <button class="btn refresh" onclick="loadUsers()">🔄 REFRESH</button></h2>
    <div id="userList">Memuat data...</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, where, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBK7pa3LJCxF1bP5_SbEA_3wQo5280n1FY", authDomain: "nanzz-account.firebaseapp.com", projectId: "nanzz-account", storageBucket: "nanzz-account.firebasestorage.app", messagingSenderId: "592556282125", appId: "1:592556282125:web:6f3b4ec30e1a362c106044" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const SUPER_DEV = "afnanpratama427@gmail.com";
let unsub = null;

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}
window.logout = function(){ signOut(auth).then(()=>location.href='auth.html'); }

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'auth.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  const isDev = (snap.exists() && snap.data().role === 'developer') || user.email === SUPER_DEV;
  if (isDev) { loadUsers(user.email); } else { location.href = 'auth.html'; }
});

window.loadUsers = function(currentEmail) {
  if (unsub) unsub();
  document.getElementById('userList').innerHTML = 'Memuat data...';
  unsub = onSnapshot(collection(db, 'users'), (snap) => {
    let html = '';
    const isSuper = currentEmail === SUPER_DEV;
    
    snap.forEach(d => {
      const u = d.data();
      const isTargetSuper = u.email === SUPER_DEV;
      const isTargetDev = u.role === 'developer';
      
      // TOMBOL AKSI KHUSUS SUPER ADMIN
      const actionButtons = isTargetSuper ? '<span style="font-size:12px;font-weight:900;background:var(--line);color:#fff;padding:6px 10px;border:3px solid var(--line)">SUPER ADMIN</span>' : `
        ${isSuper ? `
          ${u.banned ? `<button class="btn unban" onclick="unban('${d.id}')">UNBAN</button>` : `<button class="btn ban" onclick="ban('${d.id}')">BAN</button>`}
          ${isTargetDev ? `<button class="btn" onclick="removeDev('${d.id}')">COPOT DEV</button>` : `<button class="btn dev" onclick="makeDev('${d.id}')">JADIKAN DEV</button>`}
          <button class="btn del" onclick="delUser('${d.id}', '${u.name}')">HAPUS</button>
        ` : `<span style="font-size:12px;font-weight:900;opacity:.5">Read Only</span>`}
      `;
      
      html += `
        <div class="user-row">
          <div class="user-info">
            <div class="user-name">@${u.name} ${u.banned ? '<span class="badge ban">BANNED</span>' : '<span class="badge ok">AKTIF</span>'} ${isTargetDev || isTargetSuper ? '<span class="badge dev">DEVELOPER</span>' : ''}</div>
            <div class="user-email">${u.email}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">${actionButtons}</div>
        </div>`;
    });
    document.getElementById('userList').innerHTML = html || '<div style="font-weight:900">Belum ada user.</div>';
  });
}

// Fungsi-fungsi ini cuma bisa dipanggil kalau tombolnya muncul (Super Admin)
window.ban = async (uid) => { if(confirm('Ban user ini?')) await updateDoc(doc(db, 'users', uid), { banned: true }); };
window.unban = async (uid) => { await updateDoc(doc(db, 'users', uid), { banned: false }); };
window.makeDev = async (uid) => { if(confirm('Jadikan user ini Developer?')) await updateDoc(doc(db, 'users', uid), { role: 'developer' }); };
window.removeDev = async (uid) => { if(confirm('Cabut akses Developer?')) await updateDoc(doc(db, 'users', uid), { role: 'user' }); };
window.delUser = async (uid, name) => {
  if(!confirm(`Hapus akun @${name} permanen beserta postingannya?`)) return;
  await deleteDoc(doc(db, 'users', uid));
  await deleteDoc(doc(db, 'usernames', name.toLowerCase()));
  const postsSnap = await getDocs(query(collection(db, 'posts'), where('author', '==', name)));
  postsSnap.forEach(async (d) => await deleteDoc(d.ref));
  alert('User dihapus.');
};
</script>
</body>
</html>
