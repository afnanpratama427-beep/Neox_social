<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upload · NEOX</title>
<style>
  :root{color-scheme:light;--bg:#f0f4f8;--fg:#111111;--acc:#ffe14d;--acc2:#ff5252;--acc3:#4dff88;--card:#ffffff;--line:#111111}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background-color:var(--bg);background-image:radial-gradient(#cbd5e1 2px,transparent 2px);background-size:20px 20px;color:var(--fg);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:24px 24px 120px}
  .top{max-width:900px;margin:0 auto 24px;display:flex;justify-content:space-between;align-items:center}
  
  .logo-wrap{display:flex;align-items:center;gap:4px}
  .logo{font-size:24px;font-weight:900;border:3px solid var(--line);background:var(--card);padding:4px 10px;box-shadow:4px 4px 0 var(--line);display:flex;align-items:center}
  .logo span{background:var(--acc);padding:0 4px;border:2px solid var(--line);margin-left:2px}
  .header-verify{background:#1877F2;color:white;border-radius:50%;padding:2px 6px;font-weight:bold;font-size:14px;border:2px solid var(--line);box-shadow:2px 2px 0 var(--line)}
  
  .card{background:var(--card);border:4px solid var(--line);box-shadow:8px 8px 0 var(--line);padding:24px;margin-bottom:24px;max-width:900px;margin-left:auto;margin-right:auto}
  h2{font-size:14px;text-transform:uppercase;font-weight:900;color:var(--line);margin-bottom:20px;border-bottom:3px solid var(--line);padding-bottom:10px;letter-spacing:1px}
  .type-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
  .type{background:var(--card);border:3px solid var(--line);padding:12px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:900;text-transform:uppercase;box-shadow:3px 3px 0 var(--line);transition:transform .05s}
  .type:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
  .type.on{background:var(--acc);transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
  .type .ico{font-size:24px;margin-bottom:6px}
  .field{margin-bottom:16px} label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
  input[type=text],textarea,select{width:100%;background:var(--card);color:var(--fg);border:3px solid var(--line);padding:12px;font-family:inherit;font-weight:600;box-shadow:3px 3px 0 var(--line);outline:none}
  input:focus,textarea:focus{border-color:var(--acc);box-shadow:3px 3px 0 var(--acc)}
  .dropzone{border:4px dashed var(--line);padding:40px 20px;text-align:center;cursor:pointer;background:var(--card);box-shadow:4px 4px 0 var(--line);transition:transform .05s}
  .dropzone:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--line)}
  .dropzone .big{font-size:40px;font-weight:900;color:var(--line);margin-bottom:8px}
  .dropzone input[type=file]{display:none}
  .preview{margin-top:16px;padding:16px;background:var(--bg);border:3px solid var(--line);display:none;box-shadow:3px 3px 0 var(--line)}
  .preview.on{display:block}
  .preview img,.preview video{max-width:100%;max-height:200px;margin-top:8px;border:3px solid var(--line)}
  .btn{background:var(--acc);color:var(--line);border:4px solid var(--line);padding:14px;font-size:14px;font-weight:900;text-transform:uppercase;cursor:pointer;box-shadow:5px 5px 0 var(--line);width:100%;transition:transform .05s}
  .btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--line)}
  .msg{font-size:13px;font-weight:700;padding:12px;margin-bottom:16px;border:3px solid;display:none;box-shadow:3px 3px 0}
  .msg.err{display:block;color:var(--line);background:var(--acc2);border-color:var(--line);box-shadow:3px 3px 0 var(--line)}
  .msg.ok{display:block;color:var(--line);background:var(--acc3);border-color:var(--line);box-shadow:3px 3px 0 var(--line)}
  .code-box{background:var(--fg);border:4px solid var(--line);padding:16px;font-family:monospace;font-size:18px;font-weight:900;color:var(--acc);text-align:center;letter-spacing:2px;margin:16px 0;box-shadow:4px 4px 0 var(--acc)}
  .link-row{display:flex;gap:8px}
  .link-row input{flex:1;font-size:12px}
  .link-row button{background:var(--card);border:3px solid var(--line);padding:0 16px;cursor:pointer;font-weight:900;box-shadow:3px 3px 0 var(--line)}
  
  /* FLOATING BRUTAL PILL NAVBAR (ADA TEKS) */
  .nav-container{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:center;z-index:100;pointer-events:none}
  .nav-pill{display:flex;gap:4px;background:var(--card);border:4px solid var(--line);padding:8px 12px;box-shadow:6px 6px 0 var(--line);pointer-events:auto;border-radius:50px}
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;height:50px;border-radius:30px;font-size:10px;font-weight:900;color:var(--line);cursor:pointer;transition:all .1s;text-decoration:none;text-transform:uppercase}
  .nav-item .ico{font-size:20px;margin-bottom:2px}
  .nav-item:active{transform:scale(0.9)}
  .nav-item.on{background:var(--acc);border:3px solid var(--line);box-shadow:2px 2px 0 var(--line)}
  .nav-item.plus{background:var(--acc2);color:#fff;border:3px solid var(--line);box-shadow:2px 2px 0 var(--line);width:50px;height:50px;border-radius:50%}
  .nav-item.plus:active{box-shadow:0 0 0 var(--line);transform:translate(2px,2px)}
  
  .progress-bar{height:10px;background:var(--bg);border:3px solid var(--line);margin:10px 0;display:none}
  .progress-bar.on{display:block}
  .progress-bar .fill{height:100%;background:var(--acc);width:0;transition:width .2s}
</style>
</head>
<body>
<div class="top">
  <div class="logo-wrap">
    <div class="logo">NE<span>OX</span></div>
    <div class="header-verify">✓</div>
  </div>
  <div style="font-size:12px;font-weight:900" id="userChip">—</div>
</div>
<div>
  <div class="card">
    <h2>// upload content</h2>
    <div class="msg" id="msg"></div>
    <div class="type-row">
      <div class="type on" data-type="image" onclick="pickType(this)"><div class="ico">🖼</div>image</div>
      <div class="type" data-type="video" onclick="pickType(this)"><div class="ico">🎬</div>video</div>
      <div class="type" data-type="audio" onclick="pickType(this)"><div class="ico">🎵</div>audio</div>
      <div class="type" data-type="file" onclick="pickType(this)"><div class="ico">📁</div>file</div>
      <div class="type" data-type="apk" onclick="pickType(this)"><div class="ico">📦</div>apk</div>
      <div class="type" data-type="html" onclick="pickType(this)"><div class="ico">🌐</div>html</div>
      <div class="type" data-type="code" onclick="pickType(this)"><div class="ico">💻</div>code</div>
      <div class="type" data-type="link" onclick="pickType(this)"><div class="ico">🔗</div>link</div>
    </div>
    <div class="field"><label>judul</label><input type="text" id="title" maxlength="80"></div>
    <div class="field"><label>deskripsi</label><textarea id="desc" maxlength="500" rows="3"></textarea></div>
    
    <div id="fileInputWrap">
      <div class="dropzone" onclick="document.getElementById('fileInput').click()">
        <div class="big">⬇</div><div style="font-weight:900">PILIH FILE (MAX 2GB)</div>
        <input type="file" id="fileInput">
      </div>
      <div class="preview" id="preview"></div>
    </div>
    <div id="linkInputWrap" style="display:none"><div class="field"><label>url link</label><input type="text" id="linkUrl"></div></div>
    <div id="codeInputWrap" style="display:none"><div class="field"><label>code</label><textarea id="codeContent" style="min-height:150px"></textarea></div></div>

    <div class="progress-bar" id="progBar"><div class="fill" id="progFill"></div></div>
    <button class="btn" id="uploadBtn" onclick="doUpload()">upload →</button>
    
    <div id="resultWrap" style="display:none;margin-top:24px">
      <h2 style="color:var(--line);border-color:var(--line)">// berhasil</h2>
      <label>code akses</label><div class="code-box" id="resultCode">—</div>
      <label>link langsung</label><div class="link-row"><input type="text" id="resultLink" readonly><button onclick="navigator.clipboard.writeText(document.getElementById('resultLink').value);showMsg('Dicopy!','ok')">COPY</button></div>
    </div>
  </div>
</div>

<!-- FLOATING BRUTAL PILL NAVBAR -->
<div class="nav-container">
  <div class="nav-pill">
    <a class="nav-item" href="public.html"><span class="ico">🏠</span>HOME</a>
    <a class="nav-item" href="public.html"><span class="ico">🔧</span>TOOLS</a>
    <a class="nav-item plus on" href="upload.html">➕</a>
    <a class="nav-item" href="public.html"><span class="ico">⚙️</span>SET</a>
    <a class="nav-item" href="public.html"><span class="ico">👤</span>INFO</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyBK7pa3LJCxF1bP5_SbEA_3wQo5280n1FY", authDomain: "nanzz-account.firebaseapp.com", projectId: "nanzz-account", storageBucket: "nanzz-account.firebasestorage.app", messagingSenderId: "592556282125", appId: "1:592556282125:web:6f3b4ec30e1a362c106044" };
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);

let currentUser = null; let currentType = 'image'; let currentFile = null; 
const MAX_SIZE = 2000 * 1024 * 1024; 
const WORKER_URL = "https://neox-storage.afnanpratama427.workers.dev/upload"; 

window.showMsg = function(t, type) { const m = document.getElementById('msg'); m.textContent = t; m.className = 'msg ' + type; setTimeout(() => m.className = 'msg', 4000); }
window.pickType = function(el) {
  document.querySelectorAll('.type').forEach(t => t.classList.remove('on')); el.classList.add('on');
  currentType = el.dataset.type; currentFile = null; document.getElementById('preview').className = 'preview';
  document.getElementById('fileInputWrap').style.display = (currentType === 'link' || currentType === 'code') ? 'none' : 'block';
  document.getElementById('linkInputWrap').style.display = currentType === 'link' ? 'block' : 'none';
  document.getElementById('codeInputWrap').style.display = currentType === 'code' ? 'block' : 'none';
}
document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > MAX_SIZE) return showMsg('Max 2GB', 'err');
  currentFile = f; const p = document.getElementById('preview'); p.className = 'preview on';
  p.innerHTML = `<div style="font-weight:900">${f.name}</div>`;
  if (currentType === 'image') p.innerHTML += `<img src="${URL.createObjectURL(f)}">`;
  if (currentType === 'video') p.innerHTML += `<video src="${URL.createObjectURL(f)}" controls></video>`;
});

function genCode() { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let o = ''; for (let i = 0; i < 8; i++) o += c[Math.floor(Math.random() * c.length)]; return o; }

window.doUpload = async function() {
  if (!currentUser) return showMsg('Belum login', 'err');
  const title = document.getElementById('title').value.trim(); if (!title) return showMsg('Judul wajib', 'err');
  
  let payload = { 
    type: currentType, title, desc: document.getElementById('desc').value.trim(), 
    author: currentUser.name, authorId: currentUser.uid, 
    authorPhoto: currentUser.photo || null, 
    isVerified: currentUser.isVerified || false, 
    createdAt: serverTimestamp(), views: 0, downloads: 0, likes: 0 
  };
  
  if (currentType === 'link') { 
    payload.url = document.getElementById('linkUrl').value.trim(); 
    if(!payload.url) return showMsg('URL kosong','err'); 
  }
  else if (currentType === 'code') { 
    payload.content = document.getElementById('codeContent').value; 
    if(!payload.content) return showMsg('Code kosong','err'); 
  }
  else { 
    if (!currentFile) return showMsg('Pilih file', 'err'); 
    
    const btn = document.getElementById('uploadBtn'); btn.disabled = true; btn.textContent = 'Uploading ke Storage...';
    const prog = document.getElementById('progBar'); prog.classList.add('on'); document.getElementById('progFill').style.width = '50%';
    
    try {
      const formData = new FormData();
      formData.append('file', currentFile);
      
      const res = await fetch(WORKER_URL, { method: 'POST', body: formData });
      const textData = await res.text();
      let data;
      try { data = JSON.parse(textData); } catch(e) { throw new Error('Worker error JSON. Cek API lu.'); }
      if (!res.ok) throw new Error(data.message || 'Gagal upload');
      
      payload.fileUrl = data.url; 
      payload.filename = currentFile.name; 
      payload.size = currentFile.size; 
      document.getElementById('progFill').style.width = '100%';
    } catch(e) {
      btn.disabled = false; btn.textContent = 'upload →';
      prog.classList.remove('on');
      return showMsg(e.message, 'err');
    }
  }

  const btn = document.getElementById('uploadBtn'); btn.disabled = true; btn.textContent = 'Menyimpan data...';
  try {
    const postCode = genCode(); await setDoc(doc(db, 'posts', postCode), payload);
    await addDoc(collection(db, 'activity'), { uid: currentUser.uid, user: currentUser.name, action: 'upload', detail: `${currentType}: ${title}`, time: serverTimestamp() });
    document.getElementById('resultCode').textContent = postCode;
    document.getElementById('resultLink').value = location.href.replace(/upload\.html.*$/, 'public.html') + '?code=' + postCode;
    document.getElementById('resultWrap').style.display = 'block'; showMsg('Berhasil!', 'ok');
  } catch(e) { showMsg('Gagal DB: ' + e.message, 'err'); } finally { btn.disabled = false; btn.textContent = 'upload →'; setTimeout(()=>document.getElementById('progBar').classList.remove('on'), 1000); }
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = 'auth.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().banned) { location.href = 'auth.html'; return; }
  
  currentUser = { uid: user.uid, ...snap.data() }; 
  document.getElementById('userChip').textContent = currentUser.name;
});
</script>
</body>
</html>
